# Render deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mortgage-monthly-costs
    runtime: python
    plan: free
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MORTGAGE_DEBUG
        value: "false"
      - key: MORTGAGE_DEFAULT_FISCAL_YEAR
        value: "2026"
      - key: PYTHON_VERSION
        value: "3.11"
    autoDeploy: true
